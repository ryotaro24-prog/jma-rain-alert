name: JMA Rain Alert

on:
  workflow_dispatch:
    inputs:
      test:
        description: "ntfyテスト通知を送る"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: jma-rain-alert
  cancel-in-progress: false

jobs:
  check-jma:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check JMA information
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: ${{ inputs.test }} 
        run: python jma_alert.py

      - name: Save notification state
        run: |
          if [[ -n "$(git status --porcelain -- seen_ids.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_ids.json
            git commit -m "Update JMA alert state"
            git push
          fi
