name: JMA Rain Alert

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  check-jma:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check JMA information
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python jma_alert.py
